plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.2'
group = 'bl4ckscor3.mod.horizontalreinforceddeepslate'

base {
	archivesName = 'horizontalreinforceddeepslate-26.1.2'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "26.1.2.15-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "HRD " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', 'horizontalreinforceddeepslate', '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		horizontalreinforceddeepslate {
			sourceSet(sourceSets.main)
		}
	}
}

tasks.named('jar', Jar).configure {
	exclude('bl4ckscor3/mod/horizontalreinforceddeepslate/datagen/**') //exclude files from the built jar that are only used to generate the assets & data

    manifest {
        attributes(["Specification-Title": "Horizontal Reinforced Deepslate",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "Horizontal Reinforced Deepslate",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 25
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}